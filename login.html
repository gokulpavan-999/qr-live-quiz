<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Admin Login</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap" style="max-width:440px;padding-top:10vh"><section class="card"><div class="pill">ADMIN LOGIN</div><h1>QR Live Quiz</h1><p class="muted">Enter the admin password to open the control panel.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button type="submit" style="margin-top:16px;width:100%">Sign in</button></form><p id="error" class="notice error hidden"></p></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href='/';}catch(err){error.textContent=err.message;error.classList.remove('hidden');}});</script></body></html>
