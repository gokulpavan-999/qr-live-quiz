<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Quiz Leaderboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><div class="pill">LIVE QUIZ RESULTS</div><h1 id="title">QR Live Quiz</h1></div>
    </header>
    <section class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboard">Participants will appear here after joining.</div>
    </section>
    <section id="winner" class="card center hidden">
      <div class="big">🏆 QUIZ WINNERS 🏆</div>
      <div id="winnerList"></div>
    </section>
    <p class="center muted">Live leaderboard • Up to 200 participants</p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/display.js"></script>
</body>
</html>
