<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Quiz</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap" style="max-width:650px"><header class="center"><div class="pill">LIVE QUIZ</div><h1 id="title">Join the Quiz</h1><p class="muted">Enter your name to participate.</p></header><section id="joinCard" class="card"><label>Your name</label><input id="name" maxlength="40" placeholder="Enter your name"><button id="joinBtn" style="width:100%">Join Quiz</button><div id="joinMsg" class="notice hidden"></div></section><section id="quizCard" class="card hidden"><div class="row" style="justify-content:space-between"><span class="pill" id="participantName"></span><span class="pill" id="timer">Waiting...</span></div><h2 id="question">Waiting for admin to publish the first question…</h2><div id="options"></div><button id="submit" style="width:100%" disabled>Submit answer</button><div id="answerMsg" class="notice hidden"></div></section><p class="center muted">Keep this page open until the winner is announced.</p></main><script src="/socket.io/socket.io.js"></script><script src="/join.js"></script></body></html>
